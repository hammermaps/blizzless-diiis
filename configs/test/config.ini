; ==========
; Docker test configuration for blizzless-diiis
; ==========
; Used by docker-compose.test.yml. Differs from configs/docker/config.ini only in
; the database backend (PostgreSQL instead of MariaDB) and the game-data path.
;
; Database credentials are injected by the compose file through DIIIS_DB_* variables;
; [Storage] below is only the fallback for manual `docker run` use.

; Battle Server
[Battle-Server]
Enabled = true
BindIP = 0.0.0.0
WebPort = 9800
Port = 1119
MotdEnabled = true
Motd = Welcome to Blizzless D3!

[IWServer]
IWServer = false

; REST API (HTTP)
[REST]
IP = 0.0.0.0
Public = true
PublicIP = 127.0.0.1
PORT = 83

; Game Server
[Game-Server]
Enabled = true
CoreActive = true
BindIP = 0.0.0.0
WebPort = 9100
Port = 1345
DRLGemu = true
IsLocalDev = false

; rates
RateExp = 1
RateMoney = 1
RateDrop = 1
RateChangeDrop = 1
RateMonsterHP = 1
RateMonsterDMG = 1
; items
ChanceHighQualityUnidentified = 30
ChanceNormalUnidentified = 5
; bosses
BossHealthMultiplier = 6
BossDamageMultiplier = 3
; nephalem
NephalemRiftProgressMultiplier = 1
; health
HealthPotionRestorePercentage = 60
HealthPotionCooldown = 30
ResurrectionCharges = 3
; waypoints
UnlockAllWaypoints = false
; player attribute modifiers
StrengthMultiplier = 1
StrengthParagonMultiplier = 1
DexterityMultiplier = 1
DexterityParagonMultiplier = 1
IntelligenceMultiplier = 1
IntelligenceParagonMultiplier = 1
VitalityMultiplier = 1
VitalityParagonMultiplier = 1
; quests
AutoSaveQuests = false
; minimap
ForceMinimapVisibility = false

[NAT]
Enabled = false
PublicIP = 127.0.0.1

; Storage – PostgreSQL for the test stack (DIIIS_DB_TYPE overrides this).
[Storage]
DatabaseType = postgres

; Logging – stdout so `docker logs` shows everything
[AnsiLog]
Enabled = false
Target = Ansi
IncludeTimeStamps = true
MinimumLevel = Debug
MaximumLevel = Fatal

[ConsoleLog]
Enabled = true
Target = Console
IncludeTimeStamps = true
MinimumLevel = Debug
MaximumLevel = Fatal

[PacketLog]
Enabled = true
Target = file
FileName = packet.log
IncludeTimeStamps = true
MinimumLevel = Debug
MaximumLevel = PacketDump

; Game data – the compose file mounts the Diablo III install read-only here.
[Storage]
GameDataPath = /d3data
