; ==========
; Docker Configuration for blizzless-diiis
; ==========
; All servers bind to 0.0.0.0 so they are reachable from outside the container.
;
; IMPORTANT – before starting the stack:
;   1. Set NAT.PublicIP to the host's external IP that game clients will connect to.
;   2. Adjust credentials in database.Account.mysql.config / database.Worlds.mysql.config
;      if you changed the MariaDB passwords in docker-compose.mysql.yml.
;
; Start the full stack with:
;   docker compose -f docker-compose.mysql.yml up -d

; Battle Server
[Battle-Server]
Enabled = true
BindIP = 0.0.0.0
WebPort = 9800
Port = 1119
MotdEnabled = true
Motd = Welcome to Blizzless D3!

[IWServer]
IWServer = false

; REST API (HTTP)
[REST]
IP = 0.0.0.0
Public = true
; Set PublicIP to the host IP that clients will use to reach the REST endpoint
PublicIP = 0.0.0.0
PORT = 83

; Game Server
[Game-Server]
Enabled = true
CoreActive = true
BindIP = 0.0.0.0
WebPort = 9100
Port = 1345
DRLGemu = true
IsLocalDev = false

; rates
RateExp = 1
RateMoney = 1
RateDrop = 1
RateChangeDrop = 1
RateMonsterHP = 1
RateMonsterDMG = 1
; items
ChanceHighQualityUnidentified = 30
ChanceNormalUnidentified = 5
; bosses
BossHealthMultiplier = 6
BossDamageMultiplier = 3
; nephalem
NephalemRiftProgressMultiplier = 1
; health
HealthPotionRestorePercentage = 60
HealthPotionCooldown = 30
ResurrectionCharges = 3
; waypoints
UnlockAllWaypoints = false
; player attribute modifiers
StrengthMultiplier = 1
StrengthParagonMultiplier = 1
DexterityMultiplier = 1
DexterityParagonMultiplier = 1
IntelligenceMultiplier = 1
IntelligenceParagonMultiplier = 1
VitalityMultiplier = 1
VitalityParagonMultiplier = 1
; quests
AutoSaveQuests = false
; minimap
ForceMinimapVisibility = false

; NAT – needed when clients connect from outside the Docker host
[NAT]
Enabled = false
; Set to the host's public IP if clients connect from external networks
PublicIP = 0.0.0.0

; Storage – use MariaDB/MySQL backend
[Storage]
DatabaseType = mysql

; Logging – write to stdout so Docker captures logs via `docker logs`
[AnsiLog]
Enabled = false
Target = Ansi
IncludeTimeStamps = true
MinimumLevel = Debug
MaximumLevel = Fatal

[ConsoleLog]
Enabled = true
Target = Console
IncludeTimeStamps = true
MinimumLevel = Debug
MaximumLevel = Fatal

[PacketLog]
Enabled = true
Target = file
FileName = packet.log
IncludeTimeStamps = true
MinimumLevel = Debug
MaximumLevel = PacketDump
