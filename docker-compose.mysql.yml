##
## docker-compose.mysql.yml
##
## Alternative compose file that uses MariaDB 10.11 instead of PostgreSQL.
##
## Usage:
##   docker-compose -f docker-compose.mysql.yml up
##
## Before starting, copy and adjust the MySQL config templates:
##   cp src/DiIiS-NA/database.Account.mysql.config  <publish-dir>/database.Account.mysql.config
##   cp src/DiIiS-NA/database.Worlds.mysql.config   <publish-dir>/database.Worlds.mysql.config
##
## Set DatabaseType = mysql  in config.ini under the [Storage] section.
##

services:
  diiis-na-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diiis-na-server
    volumes:
      - ./src/DiIiS-NA/config.ini:/app/config.ini
      - ./src/DiIiS-NA/database.Account.mysql.config:/app/database.Account.mysql.config
      - ./src/DiIiS-NA/database.Worlds.mysql.config:/app/database.Worlds.mysql.config
    ports:
      - 83:83
      - 1119:1119
      - 1345:1345
      - 2001:2001
      - 9800:9800
      - 9100:9100
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: diiis-na-db-mysql
    environment:
      - MARIADB_ROOT_PASSWORD=changeme
      - MARIADB_USER=diiis
      - MARIADB_PASSWORD=changeme
    ports:
      - 3306:3306
    volumes:
      - db-mysql-data:/var/lib/mysql
      - ./db/initdb/dump.mysql.sql:/docker-entrypoint-initdb.d/01-dump.sql
      - ./db/initdb/dump.worlds.mysql.sql:/docker-entrypoint-initdb.d/02-dump-worlds.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-mysql-data:
