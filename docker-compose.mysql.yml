##
## docker-compose.mysql.yml
##
## Runs the blizzless-diiis game server with a MariaDB 10.11 database.
## The database schemas are imported automatically on the first start.
##
## Quick start:
##   docker compose -f docker-compose.mysql.yml up -d
##
## To watch server logs:
##   docker compose -f docker-compose.mysql.yml logs -f diiis-na-server
##
## To stop and remove containers (data volume is preserved):
##   docker compose -f docker-compose.mysql.yml down
##
## Configuration:
##   - Credentials          → .env  (MARIADB_USER, MARIADB_PASSWORD, MARIADB_ROOT_PASSWORD)
##   - Game server settings → configs/docker/config.ini
##
##   The DB connection is configured automatically via DIIIS_DB_* environment
##   variables that are passed to the server container.  You only need to edit
##   .env (or export the variables in your shell) to change credentials –
##   no config file editing required.
##
##   For clients connecting from outside the Docker host, set
##   NAT.Enabled=true and NAT.PublicIP in configs/docker/config.ini.
##

services:
  diiis-na-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diiis-na-server
    restart: unless-stopped
    volumes:
      # Docker-specific game server config (BindIP=0.0.0.0, DatabaseType=mysql)
      - ./configs/docker/config.ini:/app/config.ini
      # Database connection configs pointing to the "db" service
      - ./configs/docker/database.Account.mysql.config:/app/database.Account.mysql.config
      - ./configs/docker/database.Worlds.mysql.config:/app/database.Worlds.mysql.config
    environment:
      # DB connection – automatically derived from the MariaDB credentials in .env.
      # These override any [Storage] entries in config.ini.
      - DIIIS_DB_TYPE=mysql
      - DIIIS_DB_SERVER=db
      - DIIIS_DB_PORT=3306
      - DIIIS_DB_USER=${MARIADB_USER:-diiis}
      - DIIIS_DB_PASSWORD=${MARIADB_PASSWORD:-changeme}
    ports:
      - "83:83"       # REST / HTTP API
      - "1119:1119"   # Battle-Server
      - "1345:1345"   # Game-Server
      - "2001:2001"   # Game-Server (alt port)
      - "9800:9800"   # Battle-Server WebPort
      - "9100:9100"   # Game-Server WebPort
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: diiis-na-db-mysql
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-changeme}
      - MARIADB_USER=${MARIADB_USER:-diiis}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-changeme}
    ports:
      # Bind to 127.0.0.1 so MariaDB is only reachable from the host itself,
      # not from external interfaces.  The app container reaches the DB via
      # the internal Compose network (service name "db") without needing this
      # port at all; expose it only for local admin tools.
      - "127.0.0.1:3306:3306"
    volumes:
      - db-mysql-data:/var/lib/mysql
      # SQL dumps are imported in order on first start
      - ./db/initdb/dump.mysql.sql:/docker-entrypoint-initdb.d/01-dump.sql
      - ./db/initdb/dump.worlds.mysql.sql:/docker-entrypoint-initdb.d/02-dump-worlds.sql
      - ./db/initdb/03-grants.sh:/docker-entrypoint-initdb.d/03-grants.sh
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-mysql-data:
