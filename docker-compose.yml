services:
  diiis-na-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diiis-na-server
    volumes:
     - ./src/DiIiS-NA/config.ini:/app/config.ini
    environment:
      # DB connection – automatically derived from the PostgreSQL credentials in .env.
      # These override any [Storage] entries in config.ini.
      - DIIIS_DB_TYPE=postgres
      - DIIIS_DB_SERVER=db
      - DIIIS_DB_PORT=5432
      - DIIIS_DB_USER=${POSTGRES_USER:-postgres}
      - DIIIS_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - 83:83
      - 1119:1119
      - 1345:1345
      - 2001:2001
      - 9800:9800
      - 9100:9100
      
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: diiis-na-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-diablo}
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
